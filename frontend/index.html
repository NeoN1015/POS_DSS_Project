<body
  class="bg-slate-100 dark:bg-zinc-950 text-slate-800 dark:text-zinc-100 antialiased font-sans selection:bg-indigo-500 selection:text-white min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Register Service Worker for mobile installation & caching
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.log('SW registration note:', err);
        });
      });
    }
  </script>
</body>
